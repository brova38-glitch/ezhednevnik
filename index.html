<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ежедневник</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ежедневник">
<meta name="theme-color" content="#7c4dff"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-v2-180.png"><link rel="icon" href="icon-v2-192.png">
<style>
:root{--bg:#f4f2fb;--card:rgba(255,255,255,.85);--tx:#1b1830;--mu:#8a86a0;--ac:#7c4dff;--ac2:#ff6f61;--red:#ef4b5f;--bd:rgba(30,20,80,.08);--sh:0 8px 24px rgba(60,30,140,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0e0c18;--card:rgba(32,28,50,.85);--tx:#f1effa;--mu:#9792b0;--ac:#9a78ff;--bd:rgba(255,255,255,.08);--red:#ff6b7d;--sh:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#7c4dff,#c05cd6 55%,#ff6f61);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 56px;border-radius:0 0 28px 28px}
header small{opacity:.85;font-size:15px}header h1{margin:2px 0 0;font-size:32px;letter-spacing:-.5px}
main{padding:0 14px;margin-top:-40px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mh b{font-size:20px}.ib{width:44px;height:44px;border:0;border-radius:14px;background:var(--bd);color:var(--ac);font-size:22px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:13px;color:var(--mu);padding:6px 0;font-weight:600}.wd.we{color:var(--red)}
.d{height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:transform .15s,background .2s}
.d:active{transform:scale(.9)}.d.we{color:var(--red)}.d.td{color:var(--ac);font-weight:700;box-shadow:inset 0 0 0 2px var(--ac)}
.d.sel{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 14px rgba(124,77,255,.35)}
.dots{display:flex;gap:2px;height:5px;margin-top:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--ac)}.d.sel .dots i{background:#fff}
h2{font-size:22px;margin:2px 0 2px}.hol{color:var(--red);font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--bd);animation:up .25s ease}.row:last-child{border:0}
.row .t{flex:1;word-break:break-word;transition:color .2s}.row.done .t{text-decoration:line-through;color:var(--mu)}
.ck{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--ac);background:none;color:#fff;font-size:15px;padding:0}
.done .ck{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.x{width:44px;height:44px;border:0;background:none;color:var(--mu);font-size:22px}
.tm{font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;min-width:56px}
.empty{text-align:center;color:var(--mu);padding:22px 0 10px}.empty div{font-size:40px;margin-bottom:6px}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:32px;box-shadow:0 10px 24px rgba(124,77,255,.45);transition:transform .15s}.fab:active{transform:scale(.9)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav button.on{color:var(--ac);font-weight:600}nav svg{width:26px;height:26px}
.sheet{position:fixed;inset:0;background:rgba(10,5,30,.4);display:none;align-items:flex-end;z-index:9}.sheet.open{display:flex}
.sheet form{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:sl .25s ease}
@keyframes sl{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 12px}.sheet input{width:100%;font-size:17px;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
.btns{display:flex;gap:10px}.btns button{flex:1;height:50px;border-radius:14px;border:0;font-size:17px;font-weight:600}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}.sec{background:var(--bd);color:var(--tx)}
.mu{color:var(--mu);font-size:14px;text-align:center;padding:0 10px}.hid{display:none}
</style></head><body>
<header><small id="today"></small><h1 id="ttl">Ежедневник</h1></header>
<main>
<section id="cal"><div class="card"><div class="mh"><button class="ib" id="pv" aria-label="Назад">‹</button><b id="mt"></b><button class="ib" id="nx" aria-label="Вперёд">›</button></div><div class="g" id="grid"></div></div>
<div class="card" id="dc"><h2 id="dt"></h2><div id="dh" class="hol"></div><div id="tl"></div></div></section>
<section id="rem" class="hid"><div class="card"><div id="rl"></div></div>
<p class="mu">Ежедневные напоминания хранятся только на этом устройстве и не показываются в календаре.</p></section>
</main>
<button class="fab" id="fab" aria-label="Добавить">+</button>
<nav><button id="b1" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь</button>
<button id="b2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>Напоминания</button></nav>
<div class="sheet" id="sh"><form id="sf"><h3 id="sht"></h3><input type="time" id="rt" value="09:00" class="hid"><input id="si" placeholder="Что нужно сделать?" autocomplete="off">
<div class="btns"><button type="button" class="sec" id="cn">Отмена</button><button class="pri">Добавить</button></div></form></div>
<script>
const M=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
W=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],WF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const H={};for(const y of[2026,2027,2028]){for(let i=1;i<=6;i++)H[`${y}-01-0${i}`]='Новогодние каникулы';H[`${y}-01-07`]='Рождество Христово';H[`${y}-01-08`]='Новогодние каникулы';
H[`${y}-02-23`]='День защитника Отечества';H[`${y}-03-08`]='Международный женский день';H[`${y}-05-01`]='Праздник Весны и Труда';H[`${y}-05-09`]='День Победы';H[`${y}-06-12`]='День России';H[`${y}-11-04`]='День народного единства'}
H['2026-12-31']='Выходной день';
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let T=L('ezh_tasks')||{},R=L('ezh_rem')||[],tab=1;
const p=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
const now=new Date();let vy=now.getFullYear(),vm=now.getMonth(),sel=key(now);
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('today').textContent=`Сегодня, ${now.getDate()} ${MG[now.getMonth()]}, ${WF[now.getDay()]}`;
function cal(){$('mt').textContent=M[vm]+' '+vy;const tk=key(new Date());let h=W.map((w,i)=>`<div class="wd${i>4?' we':''}">${w}</div>`).join('');
const off=(new Date(vy,vm,1).getDay()+6)%7,n=new Date(vy,vm+1,0).getDate();h+='<div></div>'.repeat(off);
for(let i=1;i<=n;i++){const d=new Date(vy,vm,i),k=key(d),we=d.getDay()%6==0||H[k],c=(T[k]||[]).filter(t=>!t.done).length;
h+=`<div class="d${we?' we':''}${k==tk?' td':''}${k==sel?' sel':''}" data-k="${k}">${i}<span class="dots">${'<i></i>'.repeat(Math.min(c,3))}</span></div>`}
$('grid').innerHTML=h;day()}
function day(){const[y,m,d]=sel.split('-').map(Number),dt=new Date(y,m-1,d);const w=WF[dt.getDay()];$('dt').textContent=`${d} ${MG[m-1]}, ${w}`;$('dh').textContent=H[sel]?'🎉 '+H[sel]:'';
const l=T[sel]||[];$('tl').innerHTML=l.length?l.map((t,i)=>`<div class="row${t.done?' done':''}"><button class="ck" data-i="${i}" aria-label="Готово">${t.done?'✓':''}</button><span class="t">${esc(t.text)}</span><button class="x" data-d="${i}" aria-label="Удалить">×</button></div>`).join(''):'<div class="empty"><div>🌿</div>На этот день задач нет<br><small>Нажмите «+», чтобы добавить</small></div>'}
function rem(){R.sort((a,b)=>a.time.localeCompare(b.time));$('rl').innerHTML=R.length?R.map((r,i)=>`<div class="row"><span class="tm">${esc(r.time)}</span><span class="t">${esc(r.text)}</span><button class="x" data-r="${i}" aria-label="Удалить">×</button></div>`).join(''):'<div class="empty"><div>🔔</div>Напоминаний пока нет<br><small>Нажмите «+», чтобы добавить</small></div>'}
$('grid').onclick=e=>{const el=e.target.closest('.d');if(el){sel=el.dataset.k;cal()}};
$('pv').onclick=()=>{if(--vm<0){vm=11;vy--}cal()};$('nx').onclick=()=>{if(++vm>11){vm=0;vy++}cal()};
$('tl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const l=T[sel]||[];if(b.dataset.i!=null)l[b.dataset.i].done=!l[b.dataset.i].done;else{l.splice(b.dataset.d,1);if(!l.length)delete T[sel]}S('ezh_tasks',T);cal()};
$('rl').onclick=e=>{const b=e.target.closest('button');if(b){R.splice(b.dataset.r,1);S('ezh_rem',R);rem()}};
function setTab(t){tab=t;$('b1').className=t==1?'on':'';$('b2').className=t==2?'on':'';$('cal').className=t==1?'':'hid';$('rem').className=t==2?'':'hid';$('ttl').textContent=t==1?'Ежедневник':'Напоминания'}
$('b1').onclick=()=>setTab(1);$('b2').onclick=()=>setTab(2);
$('fab').onclick=()=>{const[y,m,d]=sel.split('-').map(Number);$('sht').textContent=tab==1?`Задача на ${d} ${MG[m-1]}`:'Ежедневное напоминание';$('rt').className=tab==1?'hid':'';$('si').placeholder=tab==1?'Что нужно сделать?':'Текст напоминания';$('si').value='';$('sh').classList.add('open');setTimeout(()=>$('si').focus(),50)};
const close=()=>$('sh').classList.remove('open');$('cn').onclick=close;$('sh').onclick=e=>{if(e.target.id=='sh')close()};
$('sf').onsubmit=e=>{e.preventDefault();const v=$('si').value.trim();if(!v)return;if(tab==1){(T[sel]=T[sel]||[]).push({text:v,done:false});S('ezh_tasks',T);cal()}else{if(!$('rt').value)return;R.push({time:$('rt').value,text:v});S('ezh_rem',R);rem()}close()};
cal();rem();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
